<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08070d"
    >

    <title>One Last Thing 👀</title>


    <style>

        /* ==============================
           RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            overflow-x: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    rgba(255, 80, 160, 0.16),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 15% 85%,
                    rgba(130, 70, 255, 0.13),
                    transparent 30%
                ),

                #08070d;

            position: relative;
        }


        /* ==============================
           BACKGROUND GLOW
        ============================== */

        .glow {

            position: fixed;

            width: 220px;
            height: 220px;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.15;

            pointer-events: none;

            z-index: 0;
        }


        .glow.one {

            background: #ff4fa3;

            top: 5%;

            left: -110px;

            animation:
                floatOne
                9s
                ease-in-out
                infinite
                alternate;
        }


        .glow.two {

            background: #8655ff;

            bottom: 5%;

            right: -110px;

            animation:
                floatTwo
                11s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes floatOne {

            from {
                transform:
                    translate(0, 0);
            }

            to {
                transform:
                    translate(90px, 100px);
            }
        }


        @keyframes floatTwo {

            from {
                transform:
                    translate(0, 0);
            }

            to {
                transform:
                    translate(-80px, -90px);
            }
        }


        /* ==============================
           FLOATING HEARTS
        ============================== */

        .heart {

            position: fixed;

            bottom: -30px;

            pointer-events: none;

            z-index: 1;

            opacity: 0;

            animation:
                floatHeart
                9s
                linear
                infinite;
        }


        .h1 {
            left: 10%;
            font-size: 15px;
        }


        .h2 {
            left: 35%;
            font-size: 11px;
            animation-delay: 3s;
            animation-duration: 11s;
        }


        .h3 {
            left: 70%;
            font-size: 17px;
            animation-delay: 1s;
            animation-duration: 10s;
        }


        .h4 {
            left: 88%;
            font-size: 12px;
            animation-delay: 5s;
            animation-duration: 12s;
        }


        @keyframes floatHeart {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.65;
            }

            80% {
                opacity: 0.4;
            }

            100% {

                transform:
                    translateY(-115vh)
                    rotate(25deg);

                opacity: 0;
            }
        }


        /* ==============================
           MAIN
        ============================== */

        .page {

            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 620px;

            margin: auto;

            padding:
                45px 16px 55px;

            text-align: center;
        }


        /* ==============================
           TOP TEXT
        ============================== */

        .intro {

            animation:
                introIn
                0.9s
                ease
                both;
        }


        @keyframes introIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        .mini {

            font-size: 12px;

            letter-spacing: 2px;

            color:
                rgba(255,255,255,0.40);

            margin-bottom:
                13px;
        }


        h1 {

            font-size:
                27px;

            line-height:
                1.3;

            color:
                #ffd0e7;

            margin-bottom:
                20px;

            font-weight:
                850;
        }


        .intro-text {

            font-size:
                16px;

            line-height:
                1.75;

            color:
                rgba(255,255,255,0.84);

            margin-bottom:
                4px;
        }


        .intro-text .highlight {

            color:
                #ffb1d5;

            font-weight:
                750;
        }


        .roast {

            display:
                inline-block;

            margin-top:
                7px;

            font-size:
                13px;

            color:
                rgba(255,255,255,0.40);

            font-style:
                italic;
        }


        /* ==============================
           COLLAGE FRAME
        ============================== */

        .photo-section {

            margin-top:
                30px;

            animation:
                photoIn
                1s
                0.25s
                ease
                both;
        }


        @keyframes photoIn {

            from {

                opacity: 0;

                transform:
                    scale(0.94)
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }


        .photo-label {

            display:
                inline-block;

            padding:
                6px 12px;

            border-radius:
                999px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid
                rgba(255,255,255,0.10);

            color:
                rgba(255,255,255,0.55);

            font-size:
                11px;

            letter-spacing:
                1px;

            margin-bottom:
                14px;
        }


        /* ==============================
           COLLAGE
        ============================== */

        .collage-wrapper {

            position:
                relative;

            width:
                100%;

            padding:
                9px;

            border-radius:
                22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.13),
                    rgba(255,255,255,0.035)
                );

            border:
                1px solid
                rgba(255,255,255,0.13);

            box-shadow:

                0 25px 70px
                rgba(0,0,0,0.45),

                0 0 50px
                rgba(255,70,160,0.09);
        }


        .collage-wrapper::before {

            content:
                "♡";

            position:
                absolute;

            top:
                -17px;

            right:
                14px;

            width:
                34px;

            height:
                34px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                50%;

            background:
                #17101e;

            border:
                1px solid
                rgba(255,170,210,0.18);

            color:
                #ffacd3;

            font-size:
                18px;

            z-index:
                3;
        }


        .collage {

            display:
                block;

            width:
                100%;

            height:
                auto;

            border-radius:
                15px;

            object-fit:
                contain;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.25);

            animation:
                photoGlow
                4s
                ease-in-out
                infinite;
        }


        @keyframes photoGlow {

            0%,
            100% {

                box-shadow:
                    0 8px 25px
                    rgba(0,0,0,0.25);
            }

            50% {

                box-shadow:
                    0 8px 35px
                    rgba(255,90,170,0.15);
            }
        }


        /* ==============================
           CAPTION
        ============================== */

        .caption {

            margin-top:
                25px;

            animation:
                captionIn
                1s
                0.6s
                ease
                both;
        }


        @keyframes captionIn {

            from {

                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        .caption h2 {

            font-size:
                21px;

            color:
                #ffd0e6;

            margin-bottom:
                7px;
        }


        .caption p {

            font-size:
                14px;

            color:
                rgba(255,255,255,0.45);
        }


        /* ==============================
           DIVIDER
        ============================== */

        .divider {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            margin:
                28px auto 0;

            max-width:
                210px;
        }


        .divider::before,
        .divider::after {

            content:
                "";

            height:
                1px;

            flex:
                1;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.16)
                );
        }


        .divider span {

            font-size:
                12px;

            opacity:
                0.5;
        }


        /* ==============================
           NEXT BUTTON
        ============================== */

        .next {

            margin-top:
                25px;
        }


        .next-text {

            font-size:
                12px;

            color:
                rgba(255,255,255,0.35);

            margin-bottom:
                11px;
        }


        .next-btn {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                100%;

            min-height:
                52px;

            border-radius:
                999px;

            text-decoration:
                none;

            color:
                #fff;

            font-size:
                15px;

            font-weight:
                800;

            background:
                linear-gradient(
                    135deg,
                    #ff4f9d,
                    #9958ff
                );

            box-shadow:
                0 12px 35px
                rgba(255,80,160,0.22);

            transition:
                transform 0.2s ease;
        }


        .next-btn:active {

            transform:
                scale(0.95);
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 480px) {

            .page {

                padding:
                    35px 14px 45px;
            }


            h1 {

                font-size:
                    25px;
            }


            .intro-text {

                font-size:
                    15px;

                line-height:
                    1.72;
            }


            .collage-wrapper {

                padding:
                    7px;

                border-radius:
                    19px;
            }


            .collage {

                border-radius:
                    13px;
            }


            .caption h2 {

                font-size:
                    20px;
            }
        }


        /* ==============================
           SMALL PHONES
        ============================== */

        @media (max-width: 350px) {

            .page {

                padding-left:
                    11px;

                padding-right:
                    11px;
            }


            h1 {

                font-size:
                    23px;
            }


            .intro-text {

                font-size:
                    14px;
            }


            .caption h2 {

                font-size:
                    18px;
            }
        }


        /* ==============================
           REDUCED MOTION
        ============================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="glow one"></div>

    <div class="glow two"></div>


    <!-- Floating hearts -->

    <span class="heart h1">❤️</span>
    <span class="heart h2">💗</span>
    <span class="heart h3">💕</span>
    <span class="heart h4">💖</span>


    <!-- MAIN -->

    <main class="page">


        <!-- INTRO -->

        <section class="intro">


            <div class="mini">
                PHOTO EVIDENCE FOUND 📂
            </div>


            <h1>
                📸 Okayyy... one last thing 👀
            </h1>


            <p class="intro-text">

                Itni bakchodi k beech

                <br>

                thodi si
                <span class="highlight">
                    cute photos
                </span>
                bhi deserve karti h tu 😭❤️

            </p>


            <span class="roast">
                Bas thodi si. Zyada udd mt. 💀
            </span>


        </section>


        <!-- COLLAGE -->

        <section class="photo-section">


            <div class="photo-label">
                AAROHI PHOTO DATABASE 🐶
            </div>


            <div class="collage-wrapper">

                <img
                    src="images/collage.png"
                    alt="Birthday collage"
                    class="collage"
                >

            </div>


        </section>


        <!-- CAPTION -->

        <section class="caption">

            <h2>
                Happy Birthday Rooh ❤️
            </h2>

            <p>
                Stay the same pagal 🐶
            </p>


            <div class="divider">

                <span>♡</span>

            </div>

        </section>


        <!-- NEXT -->

        <section class="next">

            <div class="next-text">
                Okay... ab actually last page 👀
            </div>


            <a
                href="page6.html"
                class="next-btn"
            >
                ❤️ One Last Thing →
            </a>

        </section>


    </main>


</body>

</html>
