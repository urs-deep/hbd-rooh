<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#120b2b"
    >

    <title>Okay Madam... Prove It 💀</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #3b185f 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #5b174f 0%,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #090615,
                    #140b2d,
                    #210d2c,
                    #090615
                );

            position: relative;
        }


        /* =========================
           GLOWING BACKGROUND
        ========================== */

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(55px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        .glow.one {
            width: 180px;
            height: 180px;
            background: #ff4fa3;
            top: 5%;
            left: -70px;
            animation: glowMove1 8s ease-in-out infinite alternate;
        }

        .glow.two {
            width: 220px;
            height: 220px;
            background: #704cff;
            right: -90px;
            top: 40%;
            animation: glowMove2 10s ease-in-out infinite alternate;
        }

        .glow.three {
            width: 170px;
            height: 170px;
            background: #ff7ac8;
            bottom: 5%;
            left: 15%;
            animation: glowMove3 9s ease-in-out infinite alternate;
        }

        @keyframes glowMove1 {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(45px, 70px);
            }
        }

        @keyframes glowMove2 {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-50px, -40px);
            }
        }

        @keyframes glowMove3 {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(50px, -30px);
            }
        }


        /* =========================
           STARS
        ========================== */

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;

            background-image:
                radial-gradient(
                    2px 2px at 10% 20%,
                    rgba(255,255,255,0.9),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 25% 70%,
                    rgba(255,255,255,0.8),
                    transparent
                ),
                radial-gradient(
                    2px 2px at 45% 30%,
                    rgba(255,255,255,0.8),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 65% 15%,
                    rgba(255,255,255,0.9),
                    transparent
                ),
                radial-gradient(
                    2px 2px at 85% 35%,
                    rgba(255,255,255,0.8),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 75% 75%,
                    rgba(255,255,255,0.8),
                    transparent
                ),
                radial-gradient(
                    2px 2px at 35% 90%,
                    rgba(255,255,255,0.8),
                    transparent
                );

            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.45;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================
           FLOATING HEARTS
        ========================== */

        .heart {
            position: fixed;
            bottom: -30px;

            z-index: 2;

            font-size: 18px;

            opacity: 0;

            pointer-events: none;

            animation: floatHeart linear infinite;
        }

        .heart:nth-of-type(1) {
            left: 10%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .heart:nth-of-type(2) {
            left: 30%;
            animation-duration: 12s;
            animation-delay: 4s;
        }

        .heart:nth-of-type(3) {
            left: 55%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .heart:nth-of-type(4) {
            left: 78%;
            animation-duration: 13s;
            animation-delay: 5s;
        }

        .heart:nth-of-type(5) {
            left: 90%;
            animation-duration: 11s;
            animation-delay: 7s;
        }

        @keyframes floatHeart {
            0% {
                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(0.7);

                opacity: 0;
            }

            15% {
                opacity: 0.7;
            }

            80% {
                opacity: 0.5;
            }

            100% {
                transform:
                    translateY(-115vh)
                    rotate(25deg)
                    scale(1.2);

                opacity: 0;
            }
        }


        /* =========================
           BUBBLES
        ========================== */

        .bubble {
            position: fixed;
            bottom: -50px;

            border-radius: 50%;

            background: rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.12);

            pointer-events: none;

            z-index: 1;

            animation: bubbleUp linear infinite;
        }

        .bubble:nth-of-type(6) {
            width: 18px;
            height: 18px;
            left: 18%;
            animation-duration: 12s;
        }

        .bubble:nth-of-type(7) {
            width: 10px;
            height: 10px;
            left: 48%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .bubble:nth-of-type(8) {
            width: 25px;
            height: 25px;
            left: 75%;
            animation-duration: 14s;
            animation-delay: 4s;
        }

        @keyframes bubbleUp {
            from {
                transform: translateY(0);
                opacity: 0;
            }

            15% {
                opacity: 0.6;
            }

            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }


        /* =========================
           FALLING PETALS
        ========================== */

        .petal {
            position: fixed;
            top: -30px;

            z-index: 2;

            font-size: 14px;

            opacity: 0.6;

            pointer-events: none;

            animation: fallPetal linear infinite;
        }

        .petal:nth-of-type(9) {
            left: 8%;
            animation-duration: 8s;
        }

        .petal:nth-of-type(10) {
            left: 28%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .petal:nth-of-type(11) {
            left: 52%;
            animation-duration: 9s;
            animation-delay: 4s;
        }

        .petal:nth-of-type(12) {
            left: 75%;
            animation-duration: 11s;
            animation-delay: 1s;
        }

        .petal:nth-of-type(13) {
            left: 92%;
            animation-duration: 8s;
            animation-delay: 3s;
        }

        @keyframes fallPetal {
            0% {
                transform:
                    translateY(-20px)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.65;
            }

            50% {
                transform:
                    translateY(50vh)
                    translateX(25px)
                    rotate(160deg);
            }

            100% {
                transform:
                    translateY(110vh)
                    translateX(-30px)
                    rotate(320deg);

                opacity: 0;
            }
        }


        /* =========================
           MAIN PAGE
        ========================== */

        .page {
            position: relative;
            z-index: 5;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 28px 16px;
        }

        .quiz-card {
            width: 100%;
            max-width: 500px;

            padding: 32px 22px;

            text-align: center;

            border-radius: 28px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.07);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            box-shadow:
                0 20px 70px
                rgba(0,0,0,0.35);

            animation: cardEnter 0.9s ease forwards;
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform:
                    translateY(30px)
                    scale(0.97);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================
           TOP ICON
        ========================== */

        .quiz-icon {
            font-size: 40px;

            margin-bottom: 18px;

            animation:
                floatingIcon
                2.5s
                ease-in-out
                infinite;
        }

        @keyframes floatingIcon {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }


        /* =========================
           TEXT
        ========================== */

        .intro {
            font-size: 17px;
            line-height: 1.7;

            color:
                rgba(255,255,255,0.9);

            margin-bottom: 25px;
        }

        .question-label {
            font-size: 14px;

            color:
                rgba(255,255,255,0.6);

            margin-bottom: 8px;
        }

        .question {
            font-size: 21px;
            font-weight: 700;

            line-height: 1.5;

            margin-bottom: 24px;

            color: #ffffff;
        }


        /* =========================
           INPUT
        ========================== */

        .answer-input {
            width: 100%;

            min-height: 54px;

            padding: 14px 18px;

            border-radius: 16px;

            border:
                1px solid
                rgba(255,255,255,0.18);

            outline: none;

            background:
                rgba(0,0,0,0.18);

            color: #ffffff;

            text-align: center;

            font-size: 18px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

            -webkit-appearance: none;
        }

        .answer-input::placeholder {
            color:
                rgba(255,255,255,0.35);
        }

        .answer-input:focus {
            border-color:
                rgba(255,105,180,0.8);

            background:
                rgba(0,0,0,0.25);

            box-shadow:
                0 0 0 4px
                rgba(255,105,180,0.10);
        }


        /* =========================
           BUTTON
        ========================== */

        .unlock-btn {
            width: 100%;

            min-height: 54px;

            margin-top: 15px;

            padding: 14px 20px;

            border: none;

            border-radius: 999px;

            font-size: 16px;
            font-weight: 700;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #ff4f9a,
                    #9b5cff
                );

            box-shadow:
                0 10px 30px
                rgba(255,79,154,0.28);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .unlock-btn:active {
            transform: scale(0.95);
        }

        @media (hover: hover) and (pointer: fine) {

            .unlock-btn:hover {
                transform:
                    translateY(-3px)
                    scale(1.01);

                box-shadow:
                    0 14px 35px
                    rgba(255,79,154,0.38);
            }
        }


        /* =========================
           RESULT MESSAGE
        ========================== */

        .result {
            min-height: 28px;

            margin-top: 17px;

            font-size: 15px;

            line-height: 1.5;

            font-weight: 600;
        }

        .wrong {
            color: #ffb5d9;

            animation:
                shake
                0.35s
                ease;
        }

        .success {
            color: #baffd7;

            animation:
                successPop
                0.5s
                ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-7px);
            }

            50% {
                transform: translateX(7px);
            }

            75% {
                transform: translateX(-5px);
            }
        }

        @keyframes successPop {

            0% {
                opacity: 0;
                transform: scale(0.7);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            .page {
                padding:
                    20px 14px;
            }

            .quiz-card {
                padding:
                    30px 20px;

                border-radius:
                    24px;
            }

            .quiz-icon {
                font-size: 36px;
            }

            .intro {
                font-size: 16px;
            }

            .question {
                font-size: 19px;
            }

            .answer-input {
                font-size: 17px;
            }

            .unlock-btn {
                font-size: 16px;
            }
        }


        /* =========================
           REDUCED MOTION
        ========================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="stars"></div>

    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="glow three"></div>

    <!-- Hearts -->
    <span class="heart">❤️</span>
    <span class="heart">💗</span>
    <span class="heart">💕</span>
    <span class="heart">💖</span>
    <span class="heart">💗</span>

    <!-- Bubbles -->
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>

    <!-- Petals -->
    <span class="petal">🌸</span>
    <span class="petal">🌷</span>
    <span class="petal">🌸</span>
    <span class="petal">🌷</span>
    <span class="petal">🌸</span>


    <!-- QUIZ -->

    <main class="page">

        <section class="quiz-card">

            <div class="quiz-icon">
                🔐
            </div>

            <p class="intro">
                Agr tujhe tera bday surprise dekhna h
                toh iska jawab de 👇🏻
            </p>

            <p class="question-label">
                Question 🤔
            </p>

            <h1 class="question">
                What nickname did I use to call you
                while roasting you? 💀
            </h1>

            <input
                type="text"
                id="answer"
                class="answer-input"
                placeholder="Type your answer..."
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
            >

            <button
                id="unlockBtn"
                class="unlock-btn"
            >
                👇🏻 Unlock My Surprise
            </button>

            <div
                id="result"
                class="result"
                aria-live="polite"
            ></div>

        </section>

    </main>


    <script>

        const answerInput =
            document.getElementById("answer");

        const unlockBtn =
            document.getElementById("unlockBtn");

        const result =
            document.getElementById("result");


        function checkAnswer() {

            const answer =
                answerInput.value
                    .trim()
                    .toLowerCase();


            if (!answer) {

                result.textContent =
                    "Kuch toh type kr madam 😭";

                result.className =
                    "result wrong";

                return;
            }


            if (answer === "kutiya") {

                result.textContent =
                    "Finallyyy... kuch toh yaad h tujhe 😭❤️";

                result.className =
                    "result success";


                unlockBtn.textContent =
                    "🎉 Unlocking...";


                unlockBtn.disabled = true;


                answerInput.disabled = true;


                setTimeout(() => {

                    window.location.href =
                        "page2.html";

                }, 900);

            } else {

                const roastMessages = [

                    "💀 Itni jaldi bhul gyi? Kutiya tha answer madam 😭",

                    "Bhaiii... meri roasting bhi yaad nhi tujhe? 🤡",

                    "Wrong 💀 Lagta h character profile dubara padhna padega.",

                    "😭 Kya fayda itne saal ki dosti ka... answer toh yaad nhi.",

                    "Kis nam se Beijjati krta tha terii?? 😭 bhool gii?"
                ];


                const randomRoast =
                    roastMessages[
                        Math.floor(
                            Math.random() *
                            roastMessages.length
                        )
                    ];


                result.textContent =
                    randomRoast;

                result.className =
                    "result wrong";


                answerInput.classList.remove(
                    "shake-input"
                );

                void answerInput.offsetWidth;

                answerInput.classList.add(
                    "shake-input"
                );
            }
        }


        unlockBtn.addEventListener(
            "click",
            checkAnswer
        );


        answerInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    checkAnswer();
                }

            }
        );

    </script>

</body>
</html>
